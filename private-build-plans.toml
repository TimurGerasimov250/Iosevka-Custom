[buildPlans.IosevieAileCustom]
family = "Iosevie Aile Custom"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

  [buildPlans.IosevieAileCustom.variants]
  inherits = "ss04"

    [buildPlans.IosevieAileCustom.variants.design]
    one = "no-base"
    capital-j = "serifless"
    capital-m = "flat-bottom-serifless"
    capital-q = "curly-tailed"
    capital-w = "straight-flat-top-serifless"
    g = "double-storey"
    i = "serifless"
    j = "flat-hook-serifless"
    l = "flat-tailed"
    r = "compact-serifless"
    w = "straight-flat-top-serifless"
    eszet = "longs-s-lig-middle-serifed-xh"
    lower-gamma = "casual"
    lower-iota = "flat-tailed"
    lower-nu = "casual"
    lower-upsilon = "casual-serifless"
    cyrl-capital-zhe = "symmetric-connected"
    cyrl-zhe = "symmetric-connected"
    cyrl-capital-ka = "symmetric-connected-serifless"
    cyrl-ka = "symmetric-connected-serifless"
    cyrl-em = "flat-bottom-serifless"
    cyrl-u = "straight-serifless"
    tittle = "round"
    diacritic-dot = "round"
    punctuation-dot = "round"
    braille-dot = "round"
    ampersand = "closed"
    at = "fourfold"
    bar = "natural-slope"
    micro-sign = "toothed-serifless"

    [buildPlans.IosevieAileCustom.variants.italic]
    one = "no-base"
    capital-j = "serifless"
    capital-m = "flat-bottom-serifless"
    capital-q = "curly-tailed"
    capital-w = "straight-flat-top-serifless"
    a = "single-storey-serifless"
    e = "rounded"
    f = "flat-hook-extended-crossbar-at-x-height"
    g = "single-storey-serifless"
    i = "serifless"
    j = "flat-hook-serifless"
    l = "flat-tailed"
    w = "straight-flat-top-serifless"
    eszet = "longs-s-lig-middle-serifed-xh"
    lower-gamma = "casual"
    lower-iota = "flat-tailed"
    lower-nu = "casual"
    lower-upsilon = "casual-serifless"
    cyrl-capital-zhe = "symmetric-connected"
    cyrl-zhe = "symmetric-connected"
    cyrl-capital-ka = "symmetric-connected-serifless"
    cyrl-ka = "symmetric-connected-serifless"
    cyrl-em = "flat-bottom-serifless"
    tittle = "round"
    diacritic-dot = "round"
    punctuation-dot = "round"
    braille-dot = "round"
    ampersand = "closed"
    at = "fourfold"
    bar = "natural-slope"

[buildPlans.IosevieAileCustom.widths.Normal]
shape = 600
menu = 5
css = "normal"

[buildPlans.IosevieAileCustom.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.IosevieAileCustom.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
